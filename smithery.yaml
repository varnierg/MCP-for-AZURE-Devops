name: mcp-azure-devops
displayName: Azure DevOps MCP Server
description: A Model Context Protocol (MCP) server that enables AI assistants (such as Claude Desktop, Antigravity, etc.) to interact directly with Azure DevOps.
version: 1.0.0
author: Varnier Gatto <mcp_dev@jitime.com>
license: MIT
categories:
  - developer-tools
  - productivity
tags:
  - azure-devops
  - git
  - work-items
  - pipelines
runtime: container
build:
  dockerfile: Dockerfile
  dockerBuildPath: .
startCommand:
  type: http
configSchema:
  type: object
  properties:
    organization:
      type: string
      description: Azure DevOps Organization name (e.g. "myorg" or "jitime")
    username:
      type: string
      description: Your Azure DevOps username or email
    pat:
      type: string
      description: Your Azure DevOps Personal Access Token (PAT)
    defaultProject:
      type: string
      description: (Optional) The default project to use if not specified in tool calls
commandFunction: |-
  (config) => {
    const c = config || {};
    const env = {
      AZURE_DEVOPS_ORG: c.organization || '',
      AZURE_DEVOPS_USERNAME: c.username || '',
      AZURE_DEVOPS_PAT: c.pat || '',
      AZURE_DEVOPS_PROJECT: c.defaultProject || ''
    };
    if (typeof process !== 'undefined' && process.env && process.env.PORT) {
      env.PORT = process.env.PORT;
    }
    return {
      command: 'node',
      args: ['/app/dist/index.js'],
      env: env
    };
  }
exampleConfig:
  organization: "my-org"
  username: "user@email.com"
  pat: "your-pat-token-here"
  defaultProject: "MyProject"

