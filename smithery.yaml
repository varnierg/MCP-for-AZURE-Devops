name: mcp-azure-devops
displayName: Azure DevOps MCP Server
description: A Model Context Protocol (MCP) server that enables AI assistants (such as Claude Desktop, Antigravity, etc.) to interact directly with Azure DevOps.
version: 1.0.0
author: Varnier Gatto <mcp_dev@jitime.com>
license: MIT
categories:
  - developer-tools
  - productivity
tags:
  - azure-devops
  - git
  - work-items
  - pipelines
runtime: container
build:
  dockerfile: Dockerfile
  dockerBuildPath: .
startCommand:
  type: http
configSchema:
  type: object
  properties:
    organization:
      type: string
      description: Azure DevOps Organization name (e.g. "myorg" or "jitime")
    username:
      type: string
      description: Your Azure DevOps username or email
    pat:
      type: string
      description: Your Azure DevOps Personal Access Token (PAT)
    defaultProject:
      type: string
      description: (Optional) The default project to use if not specified in tool calls
commandFunction: |-
  (config) => {
    const c = config || {};
    const org = c.organization || '';
    const user = c.username || '';
    const pat = c.pat || '';
    const proj = c.defaultProject || '';
    
    const isWin = typeof process !== 'undefined' && process.platform === 'win32';
    
    if (isWin) {
      return {
        command: 'node',
        args: ['/app/dist/index.js'],
        env: {
          AZURE_DEVOPS_ORG: org,
          AZURE_DEVOPS_USERNAME: user,
          AZURE_DEVOPS_PAT: pat,
          AZURE_DEVOPS_PROJECT: proj
        }
      };
    } else {
      return {
        command: 'sh',
        args: [
          '-c',
          `AZURE_DEVOPS_ORG='${org}' AZURE_DEVOPS_USERNAME='${user}' AZURE_DEVOPS_PAT='${pat}' AZURE_DEVOPS_PROJECT='${proj}' node /app/dist/index.js`
        ]
      };
    }
  }
exampleConfig:
  organization: "my-org"
  username: "user@email.com"
  pat: "your-pat-token-here"
  defaultProject: "MyProject"

